name: Build Firefox Extension Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    environment: AMO_JWT_ISSUER
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync Manifest Version with Release Tag
        run: |
          RAW_TAG="${GITHUB_REF_NAME:-v1.3.3}"
          VERSION_NUM="${RAW_TAG#v}"
          echo "Updating src/manifest.json version to: ${VERSION_NUM}"
          node -e "
            const fs = require('fs');
            const manifest = JSON.parse(fs.readFileSync('src/manifest.json', 'utf8'));
            manifest.version = '${VERSION_NUM}';
            fs.writeFileSync('src/manifest.json', JSON.stringify(manifest, null, 2));
          "

      - name: Package & Sign Extension
        run: |
          mkdir -p build
          TAG_NAME="${GITHUB_REF_NAME:-v1.6.0}"

          # 1. Check for required Mozilla API signing credentials
          if [ -z "${{ secrets.AMO_JWT_ISSUER }}" ] || [ -z "${{ secrets.AMO_JWT_SECRET }}" ]; then
            echo "::error::AMO_JWT_ISSUER and AMO_JWT_SECRET secrets are required for signing the extension. Release aborted."
            exit 1
          fi

          # 2. Sign with Mozilla API (unlisted channel) and wait for Mozilla to sign and return the XPI
          echo "Signing extension with Mozilla API (unlisted channel) and waiting for signed XPI..."
          npx web-ext sign \
            --source-dir ./src \
            --api-key="${{ secrets.AMO_JWT_ISSUER }}" \
            --api-secret="${{ secrets.AMO_JWT_SECRET }}" \
            --channel=unlisted \
            --artifacts-dir ./build \
            --timeout=900000

          # 3. Standardize signed XPI filename to thinkpage-bridge-${TAG_NAME}.xpi
          GENERATED_XPI=$(ls build/*.xpi 2>/dev/null | grep -v "thinkpage-bridge-${TAG_NAME}.xpi" | head -n 1)
          if [ -n "$GENERATED_XPI" ]; then
            mv "$GENERATED_XPI" "build/thinkpage-bridge-${TAG_NAME}.xpi"
          fi

          # 4. Verify the signed XPI exists and contains valid signature before releasing
          TARGET_XPI="build/thinkpage-bridge-${TAG_NAME}.xpi"
          if [ ! -f "$TARGET_XPI" ]; then
            echo "::error::Signed XPI was not generated by Mozilla API. Aborting release."
            exit 1
          fi

          # 5. Check signature files in the XPI archive
          if ! unzip -l "$TARGET_XPI" | grep -qE "META-INF|cose\.sig"; then
            echo "::error::Generated XPI is missing Mozilla signature metadata. Aborting release."
            exit 1
          fi
          echo "Successfully verified Mozilla signature in $TARGET_XPI"

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/thinkpage-bridge-*.xpi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
