name: Build Firefox Extension Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    environment: AMO_JWT_ISSUER
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync Manifest Version with Release Tag
        run: |
          RAW_TAG="${GITHUB_REF_NAME:-v1.3.3}"
          VERSION_NUM="${RAW_TAG#v}"
          echo "Updating src/manifest.json version to: ${VERSION_NUM}"
          node -e "
            const fs = require('fs');
            const manifest = JSON.parse(fs.readFileSync('src/manifest.json', 'utf8'));
            manifest.version = '${VERSION_NUM}';
            fs.writeFileSync('src/manifest.json', JSON.stringify(manifest, null, 2));
          "

      - name: Package & Submit to Mozilla Add-ons (AMO Store)
        run: |
          mkdir -p build
          TAG_NAME="${GITHUB_REF_NAME:-v1.6.1}"

          # 1. Package installable zip for release
          cd src && zip -r "../build/thinkpage-bridge-${TAG_NAME}.zip" * && cd ..

          # 2. Check for required Mozilla API signing credentials
          if [ -z "${{ secrets.AMO_JWT_ISSUER }}" ] || [ -z "${{ secrets.AMO_JWT_SECRET }}" ]; then
            echo "::error::AMO_JWT_ISSUER and AMO_JWT_SECRET secrets are required for submitting to Mozilla Add-ons. Release aborted."
            exit 1
          fi

          # 3. Submit extension for public listing on Mozilla Add-ons (AMO) Store
          echo "Submitting extension to Mozilla Add-ons (AMO) Store (channel: listed)..."
          npx web-ext sign \
            --source-dir ./src \
            --api-key="${{ secrets.AMO_JWT_ISSUER }}" \
            --api-secret="${{ secrets.AMO_JWT_SECRET }}" \
            --channel=listed \
            --amo-metadata=amo-metadata.json \
            --artifacts-dir ./build \
            --timeout=900000 \
            --approval-timeout=0

          # 4. If Mozilla generated an XPI, standardize its filename; otherwise provide XPI package from zip
          GENERATED_XPI=$(ls build/*.xpi 2>/dev/null | grep -v "thinkpage-bridge-${TAG_NAME}.xpi" | head -n 1)
          if [ -n "$GENERATED_XPI" ]; then
            mv "$GENERATED_XPI" "build/thinkpage-bridge-${TAG_NAME}.xpi"
          elif [ ! -f "build/thinkpage-bridge-${TAG_NAME}.xpi" ]; then
            cp "build/thinkpage-bridge-${TAG_NAME}.zip" "build/thinkpage-bridge-${TAG_NAME}.xpi"
          fi

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/thinkpage-bridge-*.zip
            build/thinkpage-bridge-*.xpi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
