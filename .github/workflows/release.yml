name: Build Firefox Extension Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    environment: AMO_JWT_ISSUER
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync Manifest Version with Release Tag
        run: |
          RAW_TAG="${GITHUB_REF_NAME:-v1.3.3}"
          VERSION_NUM="${RAW_TAG#v}"
          echo "Updating src/manifest.json version to: ${VERSION_NUM}"
          node -e "
            const fs = require('fs');
            const manifest = JSON.parse(fs.readFileSync('src/manifest.json', 'utf8'));
            manifest.version = '${VERSION_NUM}';
            fs.writeFileSync('src/manifest.json', JSON.stringify(manifest, null, 2));
          "

      - name: Package & Sign Extension
        run: |
          mkdir -p build
          TAG_NAME="${GITHUB_REF_NAME:-v1.3.3}"
          
          # 1. Package installable zip
          cd src && zip -r "../build/thinkpage-bridge-${TAG_NAME}.zip" * && cd ..

          # 2. Sign with Mozilla API if secrets exist, else fallback to unsigned xpi
          if [ -n "${{ secrets.AMO_JWT_ISSUER }}" ] && [ -n "${{ secrets.AMO_JWT_SECRET }}" ]; then
            npx web-ext sign --source-dir ./src --api-key="${{ secrets.AMO_JWT_ISSUER }}" --api-secret="${{ secrets.AMO_JWT_SECRET }}" --channel=listed --approval-timeout=0 --amo-metadata=./amo-metadata.json --artifacts-dir ./build || cp "build/thinkpage-bridge-${TAG_NAME}.zip" "build/thinkpage-bridge-${TAG_NAME}.xpi"
            mv build/*.xpi "build/thinkpage-bridge-${TAG_NAME}.xpi" 2>/dev/null || true
          else
            cp "build/thinkpage-bridge-${TAG_NAME}.zip" "build/thinkpage-bridge-${TAG_NAME}.xpi"
          fi

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/thinkpage-bridge-*.zip
            build/thinkpage-bridge-*.xpi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
